name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already merged into main (for example 1.0.2)
        required: true
        type: string
      dry_run:
        description: Validate and pack without publishing or creating a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-state.mjs validate
  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12.2.1
      - run: npm ci
      - name: Pack and verify release state
        id: package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-state.mjs prepare
      - name: Publish preview
        if: inputs.dry_run
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "$TARBALL" --dry-run --access public
      - name: Publish to npm using OIDC
        if: ${{ !inputs.dry_run && steps.package.outputs.published != 'true' }}
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "$TARBALL" --access public --provenance
      - name: Verify public artifact and create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: node scripts/release-state.mjs finish
